<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play: Insurance Myth or Fact | Sanoi Turner</title>
<meta name="description" content="Two quick insurance games. Six questions, one minute.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2340;
  --navy-2:#123057;
  --gold:#E3B23C;
  --cream:#F6F2E7;
  --green:#3FA372;
  --red:#E05B4B;
  --line:rgba(246,242,231,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--navy);
  color:var(--cream);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:17px;
  line-height:1.45;
  min-height:100svh;
  display:flex;
  justify-content:center;
}
.shell{
  width:100%;
  max-width:520px;
  min-height:100svh;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
}
.top{display:flex;align-items:center;gap:12px;min-height:34px;margin-bottom:14px}
.back{
  appearance:none;border:1px solid var(--line);background:none;color:var(--cream);
  font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;cursor:pointer;
}
.back:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pips{display:flex;gap:6px;margin-left:auto}
.pip{width:9px;height:9px;border-radius:50%;border:1px solid var(--line);background:none}
.pip.hit{background:var(--gold);border-color:var(--gold)}
.pip.miss{background:var(--red);border-color:var(--red)}

h1{
  font-weight:800;font-size:clamp(34px,11vw,46px);line-height:.98;
  letter-spacing:-.03em;margin:24px 0 0;
}
h1 span{display:block;color:var(--gold)}
.sub{color:rgba(246,242,231,.72);margin:14px 0 0;max-width:30ch}

.menu{margin-top:34px;display:flex;flex-direction:column;gap:12px}
.tile{
  display:block;width:100%;text-align:left;cursor:pointer;
  background:var(--navy-2);border:1px solid var(--line);border-radius:14px;
  padding:18px 18px;color:var(--cream);font:inherit;
}
.tile b{display:block;font-weight:800;font-size:21px;letter-spacing:-.01em}
.tile small{display:block;color:rgba(246,242,231,.66);font-size:14px;margin-top:4px}
.tile.gold{background:var(--gold);color:#0A2340;border-color:var(--gold)}
.tile.gold small{color:rgba(10,35,64,.72)}

.card{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0 0}
.kicker{font-size:14px;color:var(--gold);font-weight:600;margin-bottom:14px}
.q{font-weight:800;font-size:clamp(25px,7.4vw,33px);line-height:1.14;letter-spacing:-.02em;margin:0}
.who{color:rgba(246,242,231,.72);font-size:16px;margin:0 0 14px}

.answers{margin-top:auto;padding-top:26px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px}
.btn{
  flex:1;cursor:pointer;font:inherit;font-weight:800;font-size:19px;
  padding:18px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--navy-2);color:var(--cream);
}
.btn.opt{font-size:16px;font-weight:600;text-align:left;line-height:1.3}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#0A2340}
.btn:disabled{opacity:.45;cursor:default}

.verdict{margin-top:auto;padding-top:22px}
.badge{font-weight:800;font-size:20px;letter-spacing:-.01em}
.badge.good{color:var(--green)}
.badge.bad{color:var(--red)}
.why{margin:8px 0 18px;color:rgba(246,242,231,.86)}

.domino{display:block;margin:26px auto 0}
.score{text-align:center;font-weight:800;font-size:clamp(30px,9vw,40px);letter-spacing:-.02em;margin:22px 0 6px}
.verdictline{text-align:center;color:rgba(246,242,231,.75);margin:0 auto;max-width:28ch}

.pickrow{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.chip{
  cursor:pointer;font:inherit;font-size:14px;padding:9px 13px;border-radius:999px;
  border:1px solid var(--line);background:none;color:var(--cream);
}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--navy);border-color:var(--cream)}
#preview{width:100%;border-radius:12px;margin-top:16px;display:block;border:1px solid var(--line)}
.hint{font-size:13.5px;color:rgba(246,242,231,.6);margin-top:12px}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:rgba(246,242,231,.6)}
.foot a{color:var(--gold)}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){
  .card,.menu{animation:rise .22s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
</head>

<script>

/* ============================================================

const SCENES = [
  { who:"Rohan, route taxi, one earner at home",
    q:"He can afford something small today. He says he will start next month when the road is busier.",

    ]},
  { who:"Kerry-Ann, call centre agent",
    q:"The job gives her group life cover. She is thinking of skipping her own policy.",
    opts:[

  { who:"Miss Campbell, shop owner",
    q:"Everything she has is tied up in the shop. Two children at home.",
    opts:[
      { t:"Everything stays in stock, the shop is the security", p:0, why:"Stock is only worth something if somebody is there to sell it. That is the gap." },

  { who:"Mr Reid, 45, has a policy from twenty years ago",

/* ============================================================
   STATUS CARDS are generated from the myth bank above, so every
   question you add there becomes a postable card automatically.
   ============================================================ */
const STATUS_Q = MYTHS.map(m => m.q);

/* ============================================================ */
const view = document.getElementById("view");
const back = document.getElementById("back");
const pipsEl = document.getElementById("pips");
let state = {};

back.onclick = () => home();

const QUEUE = { myth:[], scene:[] };
function draw(key, bank, n){
  if(QUEUE[key].length < n) QUEUE[key] = shuffle(bank.map((_,i)=>i));
  return QUEUE[key].splice(0,n).map(i => bank[i]);
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function setPips(marks,total){
  pipsEl.innerHTML = "";
  if(!total){ return; }
  for(let i=0;i<total;i++){
    const d = document.createElement("i");
    d.className = "pip" + (marks[i]===true?" hit":marks[i]===false?" miss":"");
    pipsEl.appendChild(d);
  }
}

/* ---------- home ---------- */
function home(){
  back.classList.add("hidden");
  setPips([],0);
  state = {};
  view.innerHTML = `
    <h1>Six questions.<span>One minute.</span></h1>
    <p class="sub">Most of what people believe about insurance in Jamaica is secondhand. See how you do.</p>
    <div class="menu">
      <button class="tile gold" data-go="myth"><b>Myth or Fact</b><small>Six drawn from ${MYTHS.length}. Different set every round.</small></button>
      <button class="tile" data-go="scene"><b>What Would You Do</b><small>Five cases drawn from ${SCENES.length}. Pick for them.</small></button>
      <button class="tile" data-go="status"><b>Make a status card</b><small>For posting. This one is for ${esc(AGENT.split(" ")[0])}.</small></button>
    </div>
    <div class="foot">
      Questions are for learning, not advice on your own situation. No prices here.
      Ask about your own on <a href="https://${esc(LINKTREE)}">${esc(LINKTREE)}</a>.
    </div>`;
  view.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const g = b.dataset.go;
    if(g==="myth") startMyth(); else if(g==="scene") startScene(); else statusMaker();
  });
}

/* ---------- myth or fact ---------- */
function startMyth(){
  back.classList.remove("hidden");
  state = { game:"myth", set:draw("myth", MYTHS, 6), i:0, marks:[], score:0 };
  askMyth();
}
function askMyth(){
  const s = state, item = s.set[s.i];
  setPips(s.marks, 6);
  view.innerHTML = `
    <div class="card">
      <div class="kicker">Question ${s.i+1} of 6</div>
      <p class="q">${esc(item.q)}</p>
      <div class="answers">
        <div class="row">
          <button class="btn" data-v="0">Myth</button>
          <button class="btn" data-v="1">Fact</button>
        </div>
      </div>
    </div>`;
  view.querySelectorAll("[data-v]").forEach(b => b.onclick = () => judgeMyth(b.dataset.v === "1"));
}
function judgeMyth(said){
  const s = state, item = s.set[s.i], right = said === item.a;
  s.marks.push(right); if(right) s.score++;
  setPips(s.marks, 6);
  view.innerHTML = `
    <div class="card">
      <div class="kicker">Question ${s.i+1} of 6</div>
      <p class="q">${esc(item.q)}</p>
      <div class="verdict">
        <div class="badge ${right?"good":"bad"}">${right?"Correct.":"Not quite."} That one is ${item.a?"fact":"myth"}.</div>
        <p class="why">${esc(item.why)}</p>
        <button class="btn primary" id="next">${s.i===5?"See your score":"Next question"}</button>
      </div>
    </div>`;
  document.getElementById("next").onclick = () => {
    s.i++;
    if(s.i>5) resultMyth(); else askMyth();
  };
}
function resultMyth(){
  const n = state.score;
  const lines = ["Everything you know came from road talk. Worth a proper conversation.",
                 "One in six. Most of what you have been told is off.",
                 "A couple landed. The rest is worth unlearning.",
                 "Halfway. You know enough to ask better questions.",
                 "Four of six. Better than most people who own a policy.",
                 "Five of six. You have clearly asked somebody before.",
                 "Clean sweep. You should be selling this."];
  setPips([],0);
  view.innerHTML = `
    <div class="card">
      ${domino(n, 6-n)}
      <div class="score">${n} of 6</div>
      <p class="verdictline">${esc(lines[n])}</p>
      ${endButtons("I scored " + n + " of 6 on your Myth or Fact game.")}
    </div>`;
  wireEnd(startMyth);
}

/* ---------- what would you do ---------- */
function startScene(){
  back.classList.remove("hidden");
  state = { game:"scene", set:draw("scene", SCENES, 5), i:0, marks:[], score:0 };
  askScene();
}
function askScene(){
  const s = state, sc = s.set[s.i];
  setPips(s.marks, 5);
  const opts = shuffle(sc.opts.map((o,ix)=>({o,ix})));
  s.order = opts;
  view.innerHTML = `
    <div class="card">
      <div class="kicker">Case ${s.i+1} of 5</div>
      <p class="who">${esc(sc.who)}</p>
      <p class="q">${esc(sc.q)}</p>
      <div class="answers">
        ${opts.map((x,k)=>`<button class="btn opt" data-k="${k}">${esc(x.o.t)}</button>`).join("")}
      </div>
    </div>`;
  view.querySelectorAll("[data-k]").forEach(b => b.onclick = () => judgeScene(+b.dataset.k));
}
function judgeScene(k){
  const s = state, sc = s.set[s.i], chosen = s.order[k].o, best = chosen.p === 2;
  s.marks.push(best); s.score += chosen.p;
  setPips(s.marks, 5);
  view.innerHTML = `
    <div class="card">
      <div class="kicker">Case ${s.i+1} of 5</div>
      <p class="who">${esc(sc.who)}</p>
      <p class="q">${esc(chosen.t)}</p>
      <div class="verdict">
        <div class="badge ${best?"good":"bad"}">${best?"Strongest call.":chosen.p===1?"Reasonable, not the strongest.":"That one costs him."}</div>
        <p class="why">${esc(chosen.why)}</p>
        <button class="btn primary" id="next">${s.i===4?"See how you did":"Next case"}</button>
      </div>
    </div>`;
  document.getElementById("next").onclick = () => {
    s.i++;
    if(s.i>4) resultScene(); else askScene();
  };
}
function resultScene(){
  const n = state.score, best = state.marks.filter(Boolean).length;
  let line = "You made the safe call more often than not.";
  if(n>=9) line = "You would give the same advice an advisor would give.";
  else if(n>=6) line = "Solid instincts. A few calls cost the family.";
  else line = "Most of these choices leave somebody carrying the bill.";
  setPips([],0);
  view.innerHTML = `
    <div class="card">
      ${domino(best, 5-best)}
      <div class="score">${n} of 10</div>
      <p class="verdictline">${esc(line)} You picked the strongest option ${best} out of 5 times.</p>
      ${endButtons("I scored " + n + " of 10 on your What Would You Do game.")}
    </div>`;
  wireEnd(startScene);
}

/* ---------- shared end screen ---------- */
function endButtons(shareText){
  const wa = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(shareText + " Got a question about my own cover.");
  return `<div class="answers">
      <a class="btn primary" style="text-align:center;text-decoration:none;display:block" href="${wa}">Ask ${esc(AGENT.split(" ")[0])} a question</a>
      <button class="btn" id="again">Play again</button>
      <button class="btn" id="menu">Other game</button>
    </div>
    <div class="foot">${esc(AGENT)}, ${esc(COMPANY)}. Nothing here is a quote or advice on your own situation.</div>`;
}
function wireEnd(again){
  const a = document.getElementById("again"); if(a) a.onclick = again;
  const m = document.getElementById("menu"); if(m) m.onclick = home;
}

/* ---------- domino tile ---------- */
function domino(left,right){
  const P = {0:[],1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],
             4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],
             6:[[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]]};
  const dot = (x,y,cx,cy,fill) => `<circle cx="${cx+ x*30}" cy="${cy + y*30}" r="8.5" fill="${fill}"/>`;
  const half = (ox,n,fill) => (P[Math.min(n,6)]||[]).map(([x,y])=>dot(x,y,ox+25,32,fill)).join("");
  return `<svg class="domino" width="188" height="104" viewBox="0 0 188 104" role="img" aria-label="${left} correct, ${right} missed">
    <rect x="1.5" y="1.5" width="185" height="101" rx="12" fill="#F6F2E7" stroke="#E3B23C" stroke-width="3"/>
    <line x1="94" y1="12" x2="94" y2="92" stroke="#0A2340" stroke-width="3" opacity=".25"/>
    ${half(0,left,"#0A2340")}
    ${half(94,right,"#E05B4B")}
  </svg>`;
}

/* ---------- status card maker ---------- */
let statusOrder = [];
let statusIndex = 0;
function nextStatus(){
  if(!statusOrder.length) statusOrder = shuffle(STATUS_Q.map((_,i)=>i));
  const at = statusOrder.indexOf(statusIndex);
  statusIndex = statusOrder[(at+1) % statusOrder.length];
  drawStatus();
}
function statusMaker(){
  back.classList.remove("hidden");
  setPips([],0);
  if(!statusOrder.length){ statusOrder = shuffle(STATUS_Q.map((_,i)=>i)); statusIndex = statusOrder[0]; }
  view.innerHTML = `
    <div class="card" style="justify-content:flex-start">
      <h1 style="font-size:32px;margin-top:6px">Status card</h1>
      <p class="sub">Pick a question, save the image, post it. Replies land in your chats.</p>
      <p class="hint" id="counter" style="margin-top:14px"></p>
      <canvas id="preview" width="1080" height="1920"></canvas>
      <div class="answers" style="padding-top:16px">
        <button class="btn primary" id="save">Save the image</button>
        <button class="btn" id="shuffleq">Different question</button>
      </div>
      <p class="hint">On iPhone, if the save does not start, press and hold the image and choose Add to Photos.</p>
    </div>`;
  document.getElementById("shuffleq").onclick = nextStatus;
  document.getElementById("save").onclick = saveStatus;
  drawStatus();
}
function drawStatus(){
  const c = document.getElementById("counter");
  if(c) c.textContent = "Card " + (statusOrder.indexOf(statusIndex)+1) + " of " + STATUS_Q.length + ". Post a different one each day.";
  const cv = document.getElementById("preview"), g = cv.getContext("2d");
  g.fillStyle = "#0A2340"; g.fillRect(0,0,1080,1920);
  g.strokeStyle = "#E3B23C"; g.lineWidth = 6; g.strokeRect(56,56,968,1808);

  g.fillStyle = "#E3B23C";
  g.font = "600 40px Archivo, sans-serif";
  g.fillText("MYTH OR FACT", 112, 260);

  g.fillStyle = "#F6F2E7";
  const text = STATUS_Q[statusIndex].replace(/^Myth or fact:\s*/i,"");
  const size = text.length > 88 ? 64 : text.length > 62 ? 74 : 84;
  g.font = "800 " + size + "px Archivo, sans-serif";
  wrap(g, text.charAt(0).toUpperCase()+text.slice(1), 112, 430, 856, Math.round(size*1.18));

  g.fillStyle = "#E3B23C";
  g.fillRect(112,1360,180,8);
  g.fillStyle = "#F6F2E7";
  g.font = "600 46px Archivo, sans-serif";
  g.fillText("Reply to this status", 112, 1450);
  g.fillStyle = "rgba(246,242,231,.72)";
  g.font = "400 40px Archivo, sans-serif";
  g.fillText("with myth or fact. I answer everyone.", 112, 1510);

  g.fillStyle = "#F6F2E7";
  g.font = "800 44px Archivo, sans-serif";
  g.fillText(AGENT, 112, 1700);
  g.fillStyle = "rgba(246,242,231,.66)";
  g.font = "400 36px Archivo, sans-serif";
  g.fillText(COMPANY + "  |  " + LINKTREE, 112, 1756);
}
function wrap(g,txt,x,y,max,lh){
  const words = txt.split(" ");
  let line = "", yy = y;
  for(const w of words){
    const test = line ? line + " " + w : w;
    if(g.measureText(test).width > max && line){ g.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  }
  if(line) g.fillText(line, x, yy);
}
function saveStatus(){
  const cv = document.getElementById("preview");
  cv.toBlob(b => {
    const url = URL.createObjectURL(b);
    const a = document.createElement("a");
    a.href = url; a.download = "status-card-" + (statusIndex+1) + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, "image/png");
}

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>{ if(document.getElementById("preview")) drawStatus(); }); }
home();
</script>
